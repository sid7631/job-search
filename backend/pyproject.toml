[project]
name = "ai-job-hunter"
version = "0.1.0"
description = "Personal AI recruiter: collects jobs, ranks them against a resume, pushes daily picks to Telegram, and serves a React dashboard."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "apscheduler>=3.10",
    "playwright>=1.48",
    "rapidfuzz>=3.10",
    "httpx>=0.27",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
job-hunter = "app.main:main"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "black>=24.10",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
